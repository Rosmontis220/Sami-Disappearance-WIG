    let idx = 0;

    // 预渲染所有段落（页面保持完整高度，可随时滚动），逐段淡入
    const els = paragraphs.map((raw) => {
        let el;
        if (raw === '<!--truth-card-->') {
            el = document.createElement('div');
            el.className = 'review-card-dlc truth-paragraph';
            el.innerHTML =

        } else {
            el = document.createElement('p');
            el.className = 'truth-paragraph';
            el.innerHTML = raw;
        }
        stage.appendChild(el);
        return el;
    });

    let userScrolled = false;
    window.addEventListener('wheel', () => { userScrolled = true; });
    window.addEventListener('touchmove', () => { userScrolled = true; }, { passive: true });

    function revealNext() {
        if (idx >= els.length) {
            const endBtn = document.getElementById('truth-end');
            const last = document.getElementById('truth-last');

            endBtn.style.display = 'inline-block';
            last.style.display = 'block';
            footer.style.display = '';
            return;

        idx += 1;
        el.classList.add('visible');

/* 先黑场吊胃口，再"突脸" */
(function () {
    const stage = document.getElementById('te-stage');
    const flash = document.getElementById('te-flash');

    function burst() {
        stage.classList.add('te-pop');
        flash.classList.add('on');
        setTimeout(() => flash.classList.remove('on'), 120);
        // 后续轻微闪烁，保持不安感
        setInterval(() => {
            if (Math.random() < .18) {
                flash.classList.add('on');
                setTimeout(() => flash.classList.remove('on'), 90);
            }
        }, 4200);
    }

    setTimeout(burst, 2300);
})();

/* 眼睛追随鼠标 */
(function () {
    const iris = document.getElementById('te-iris');
    const wrap = document.getElementById('te-eye-wrap');
    const maxShift = 16;
    let tx = 0, ty = 0, cx = 0, cy = 0;

    window.addEventListener('mousemove', (e) => {
        const r = wrap.getBoundingClientRect();
        const ex = r.left + r.width / 2;
        const ey = r.top + r.height / 2;
        const dx = (e.clientX - ex) / Math.max(r.width, 1);
        const dy = (e.clientY - ey) / Math.max(r.height, 1);
        tx = Math.max(-1, Math.min(1, dx)) * maxShift;
        ty = Math.max(-1, Math.min(1, dy)) * maxShift;
    });

    function tick() {
        cx += (tx - cx) * .08;
        cy += (ty - cy) * .08;
        iris.style.transform = 'translate(' + cx.toFixed(2) + 'px,' + cy.toFixed(2) + 'px)';
        requestAnimationFrame(tick);
    }
    tick();
})();

});
